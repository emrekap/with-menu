<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>with — Menü</title>
    <meta name="description" content="with Bar &amp; Kitchen menüsü." />
    <meta property="og:title" content="with — Menü" />
    <meta property="og:description" content="with Bar &amp; Kitchen menüsü." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f5efe6" />
    <link rel="icon" href="data:," />
    <link rel="modulepreload" href="vendor/pdfjs/pdf.min.mjs" />
    <style>
      :root {
        /* Page background. It is replaced automatically with the color at the
         edge of your PDF, so the menu blends into the page. */
        --bg: #f5efe6;
        /* How wide the menu can get on big screens. Use 100% for full width.
         (The empty sides of the PDF are trimmed off, so this is the width of
         the menu itself. A bigger number means bigger text on computers.) */
        --max-width: 560px;
        /* TR / EN switch: color of the selected language, and of the text. The
         text turns white automatically if the menu is dark. */
        --accent: #915d3e;
        --ink: #1f3027;
      }

      html,
      body {
        margin: 0;
        background: var(--bg);
        transition: background-color 0.3s ease;
      }

      body {
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }

      #menu {
        max-width: var(--max-width);
        margin: 0 auto;
        transition: opacity 0.25s ease;
      }

      /* While another language is loading, the current menu is dimmed. */
      body:not(.is-loaded) #menu {
        opacity: 0.4;
      }

      /* On phones the switch sits at the top of the page and scrolls away with
       it, so it never covers a price. On wide screens (see below) it stays in
       the corner of the screen. */
      .lang {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1;
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 999px;
        background: var(--bg);
        background: color-mix(in srgb, var(--bg) 80%, transparent);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent);
      }

      .lang button {
        position: relative;
        min-width: 38px;
        height: 30px;
        margin: 0;
        padding: 0 8px;
        border: 0;
        border-radius: 999px;
        background: none;
        color: var(--ink);
        font:
          600 12px/1 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.06em;
        opacity: 0.72;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          color 0.2s ease,
          opacity 0.2s ease;
      }

      /* Touch area a little bigger than the visible button. */
      .lang button::after {
        content: "";
        position: absolute;
        inset: -9px -2px;
      }

      .lang button:hover {
        opacity: 1;
      }

      .lang button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
        opacity: 1;
        cursor: default;
      }

      .lang button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (min-width: 800px) {
        .lang {
          position: fixed;
          top: 16px;
          right: 16px;
        }

        .lang button {
          min-width: 44px;
          height: 32px;
          font-size: 13px;
        }
      }

      .page {
        position: relative;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .page.is-ready {
        opacity: 1;
      }

      .page canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      /* The sharp close-up laid over the page when a guest zooms in. Its place
       and size are set in app.js. */
      .page canvas.detail {
        pointer-events: none;
      }

      .page a {
        position: absolute;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: pre-line;
      }

      .loader {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border: 2px solid rgba(0, 0, 0, 0.1);
        border-top-color: rgba(0, 0, 0, 0.45);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .is-loaded .loader {
        display: none;
      }

      .fallback {
        padding: 40vh 24px 0;
        text-align: center;
        font:
          16px/1.5 system-ui,
          -apple-system,
          sans-serif;
        color: #333;
      }

      .fallback a {
        color: inherit;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="lang" role="group" aria-label="Dil / Language">
      <button
        type="button"
        data-lang="tr"
        lang="tr"
        title="Türkçe"
        aria-pressed="true"
      >
        TR
      </button>
      <button
        type="button"
        data-lang="en"
        lang="en"
        title="English"
        aria-pressed="false"
      >
        EN
      </button>
    </div>
    <main id="menu" aria-label="Menü"></main>
    <div class="loader" aria-hidden="true"></div>
    <noscript>
      <style>
        .loader,
        .lang {
          display: none;
        }
      </style>
      <p class="fallback">
        <a href="menu-tr.pdf">Menüyü aç</a> ·
        <a href="menu-en.pdf" lang="en">Open the menu</a>
      </p>
    </noscript>
  </body>
</html>
